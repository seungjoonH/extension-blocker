# Application-managed clamd settings (DESIGN.md 5.4: StreamMaxLength above 50MB policy max)
LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 666
User clamav
ScanMail false
ScanArchive true
ArchiveBlockEncrypted false
MaxDirectoryRecursion 15
FollowDirectorySymlinks false
FollowFileSymlinks false
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
MaxQueue 100
IdleTimeout 30
MaxConnectionQueueLength 30
LogSyslog false
LogFacility LOG_LOCAL6
LogClean false
LogVerbose false
LogRotate true
LogFile /var/log/clamav/clamd.log
ExtendedDetectionInfo true
TCPSocket 3310
TCPAddr 127.0.0.1
MaxThreads 12
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
PCREMatchLimit 10000
PCRERecMatchLimit 5000
StreamMaxLength 62914560
Bytecode true
BytecodeSecurity TrustSigned
